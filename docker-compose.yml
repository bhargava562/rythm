version: '3.8'

services:
  # Database Service (PostgreSQL)
  db:
    image: postgres:16-alpine
    container_name: rythm-postgres
    environment:
      POSTGRES_DB: rythm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rythm"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rythm-network

  # Cache Service (Redis)
  redis:
    image: redis:7-alpine
    container_name: rythm-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rythm-network

  # Web API Service (FastAPI)
  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rythm-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/rythm
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=supersecretkeythatyoushouldchangeinproduction123456!
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - DEBUG=true
      - PORT=8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rythm-network

volumes:
  pgdata:

networks:
  rythm-network:
    driver: bridge
